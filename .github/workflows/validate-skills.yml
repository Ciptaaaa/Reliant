name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  SKILLS_REF_REF: "main"

jobs:
  structure:
    name: Repository structure and skill format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Scorer and linter regression tests
        # Pins the defects found by review: the destructive-policy denominator, bare-filename evidence,
        # long-gap negated approvals, the format order check, and linter/scorer agreement.
        run: python scripts/test_scoring.py

      - name: Lint the shipped report examples against the contract
        run: |
          # The conforming example must pass and the rejected example must fail. GitHub runs `run:` with
          # `bash -e`, where a leading `!` is the intended way to invert a status without tripping -e.
          python scripts/linter_report.py skills/migration-guard/examples/good-report.report.md
          ! python scripts/linter_report.py skills/migration-guard/examples/bad-report.report.md

      - name: Lint every recorded eval report (report only)
        # Not a gate: iterations 1-2 are committed history and score 0% format on purpose - that is the
        # evidence of the defect the contract was built to fix. Linting them here makes the number
        # visible and reproducible without pretending the past passed.
        #
        # No `if:` guard: hashFiles() matches files, not directories, so `hashFiles('evals/results/*/')`
        # is always empty and silently skipped these steps. The loops below are no-ops when nothing
        # matches, which is the guard they actually need.
        continue-on-error: true
        run: |
          shopt -s nullglob
          for dir in evals/results/*/; do
            echo "::group::lint $dir"
            python scripts/linter_report.py --reports "$dir"
            echo "::endgroup::"
          done

      - name: Score every recorded eval iteration
        # Reporting only (--report-only), and the scorecard is written outside the checkout so a stale
        # committed scorecard cannot be silently replaced by the runner.
        run: |
          shopt -s nullglob
          for dir in evals/results/*/; do
            name="$(basename "$dir")"
            echo "::group::evaluate $name"
            python scripts/evaluate_reports.py --reports "$dir" --report-only \
              --json "$RUNNER_TEMP/scorecard-$name.json"
            echo "::endgroup::"
          done

  skills-ref:
    name: Official validator (secondary)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned skills-ref
        run: |
          git clone --quiet https://github.com/agentskills/agentskills.git skills-ref-src
          cd skills-ref-src/skills-ref
          git checkout --quiet "$SKILLS_REF_REF"
          pip install --quiet .
          echo "$GITHUB_WORKSPACE/skills-ref-src/skills-ref" >> "$GITHUB_PATH"

      - name: Validate each skill
        run: |
          status=0
          for skill in skills/*/; do
            echo "::group::skills-ref validate $skill"
            skills-ref validate "${skill%/}" || status=1
            echo "::endgroup::"
          done
          exit $status

  fixtures:
    name: Verify test fixtures against real databases
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture
          MYSQL_DATABASE: fixture
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --protocol=TCP -uroot -pfixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install clients
        # `postgresql-contrib` carries `citext`, which PG-001 declares. Installing the server-side
        # package matching the service container keeps the real type in play; `check_fixtures.py` still
        # has a text stand-in so the job does not depend on it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client postgresql-contrib mariadb-client
      - name: Apply fixtures and check expected failures
        env:
          PGPASSWORD: fixture
          MYSQL_PWD: fixture
        run: |
          python scripts/check_fixtures.py \
            --postgres "postgresql://postgres:fixture@127.0.0.1:5432/fixture" \
            --mysql "mysql://root:fixture@127.0.0.1:3306/fixture"

  docs:
    name: Documentation hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check for unsubstantiated performance claims
        run: python scripts/check_claims.py README.md
